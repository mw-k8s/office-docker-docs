workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $SKELETON_PIPELINE_TYPE

stages:
  - package

include:
  - component: $CI_SERVER_FQDN/gitlabci-components/image-build-multiplatform/build@1.1.0
    inputs:
      name: onlyoffice
      tag_mode: named-image-tag
      platform:
        - linux/amd64
      image_repos:
        - registry.rz1.metaways.net/devops

# use component as a base, mostly to reuse registry login (before script)
build-onlyoffice-image:
  # overwrite component build script
  script:
    - | #shell
      source .env
      # $RELEASE_VERSION starts with a -
      if ! [[ "$CI_COMMIT_TAG" == "onlyoffice-image$RELEASE_VERSION"* ]]; then
        echo "git tag musst follow this schema: onlyoffice-image-<release versions>-<oo docker sufix (from git tag)>-mw<release counter>. eg 'onlyoffice-image$RELEASE_VERSION-1-mw1'"
        echo "release version is set in .env"
        #exit 1
      fi

      IMAGE_TAG="$(echo $CI_COMMIT_TAG | cut -c $(echo onlyoffice-image- | wc -c)-)"

      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=$DOCKERFILE \
        --opt build-arg:PRODUCT_EDITION="" \
        --opt build-arg:PRODUCT_BASEURL=https://download.onlyoffice.com/repo/centos/main/noarch/onlyoffice-documentserver \
        --opt build-arg:RELEASE_VERSION=$RELEASE_VERSION \
        --opt build-arg:DS_VERSION_HASH=$(echo -n "$(date +'%Y.%m.%d-%H%M')" | md5sum | awk '{print $1}') \
        --opt target=docs \
        --output type=image,"name=registry.rz1.metaways.net/devops/onlyoffice:$IMAGE_TAG",push=true

  # overwrite tag to not run for merge requests
  rules:
    - if: $CI_COMMIT_TAG =~ /^onlyoffice-image-.*/